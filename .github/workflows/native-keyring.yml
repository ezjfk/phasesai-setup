name: Native credential store acceptance
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/native-keyring.yml'
      - 'native_keyring_test.go'
      - 'secrets.go'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  native-store:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Windows Credential Manager roundtrip
        if: runner.os == 'Windows'
        env:
          PHASESAI_NATIVE_KEYRING_TEST: '1'
        run: go test -run '^TestNativeKeyringRoundTrip$' -count=1 .
