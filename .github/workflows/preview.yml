name: Preview builds (not a stable release)
on:
  workflow_dispatch:
  push:
    tags: ['v*-preview.*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: true
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      - name: Cross-compile preview artifacts
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="0.0.0-preview.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; fi
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=true \
              -ldflags "-X main.version=$version" \
              -o "dist/phasesai-setup-$os-$arch$suffix" .
          done
          (cd dist && sha256sum phasesai-setup-* > SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phasesai-setup-preview
          path: dist/
