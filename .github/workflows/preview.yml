name: Verified preview release
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*-preview.*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test distribution/worker.test.mjs
      - run: python scripts/test_verify_api.py
      - if: runner.os == 'Linux'
        run: bash scripts/test-bootstrap.sh
      - if: runner.os == 'Linux'
        run: go test -race ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Cross-compile preview artifacts
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="0.0.0-preview.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; fi
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=true \
              -ldflags "-X main.version=$version" \
              -o "dist/phasesai-setup-$os-$arch$suffix" .
          done
          git archive --format=tar.gz --output=dist/phasesai-setup-source.tar.gz HEAD
          cp LICENSE scripts/install.sh scripts/install.ps1 dist/
          python3 scripts/build-metadata.py "$version"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phasesai-setup-preview
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phasesai-setup-preview
          path: dist/
      - name: Publish the exact attested artifacts as a prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ezjfk/phasesai-setup
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Open source PhasesAI setup preview. Native filesystem tests passed on Windows, macOS and Linux before this build.

          Verify artifacts using `gh attestation verify FILE --repo ezjfk/phasesai-setup` and SHA256SUMS. Source commit, dependency inventory and third-party notices are included.

          Binaries have GitHub build provenance. They are not Apple-notarized or Windows Authenticode-signed. Harness recipes are source-reviewed; live model/tool certification remains separate. This is a prerelease, not a promoted stable channel.
          NOTES
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "PhasesAI setup $RELEASE_TAG" --notes-file release-notes.md
