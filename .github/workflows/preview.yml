name: Verified Windows release
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Latest native tools with an isolated profile and no Node, npm or Git on PATH
        env:
          PHASESAI_WINDOWS_ACCEPTANCE: '1'
        run: go test -run '^TestNativeWindowsCleanProfile$' -count=1 -v -timeout=20m .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test distribution/worker.test.mjs
      - run: python scripts/test_verify_api.py
  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Cross-compile Windows artifacts
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="0.0.0-preview.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9][A-Za-z0-9.-]*)?$ ]] || { echo 'Invalid release tag.' >&2; exit 1; }
            version="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist
          for arch in amd64 arm64; do
            for harness in all claude codex opencode; do
              name="phasesai-setup-windows-$arch.exe"; preset=""
              if [[ "$harness" != all ]]; then name="phasesai-$harness-setup-windows-$arch.exe"; preset="$harness"; fi
              GOOS=windows GOARCH="$arch" go build -trimpath -buildvcs=true \
                -ldflags "-X main.version=$version -X main.defaultHarness=$preset" \
                -o "dist/$name" .
            done
          done
          git archive --format=tar.gz --output=dist/phasesai-setup-source.tar.gz HEAD
          cp LICENSE scripts/install.ps1 dist/
          python3 scripts/build-metadata.py "$version"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phasesai-setup-windows
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phasesai-setup-windows
          path: dist/
      - name: Publish the exact attested artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ezjfk/phasesai-setup
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Windows-only PhasesAI installer. Downloads the latest stable harnesses, saves credentials in app config files, and adds User PATH and Start menu shortcuts. No Node.js, npm, Git, or administrator setup required.

          Verify artifacts using `gh attestation verify FILE --repo ezjfk/phasesai-setup` and SHA256SUMS. Source commit, dependency inventory and third-party notices are included.

          Windows CI validates native installation and saved authentication/configuration with an isolated profile and no Node/npm/Git on PATH. The Windows setup has also been manually tested by the maintainer.

          Binaries have GitHub build provenance. Setup EXEs are not Windows Authenticode-signed. This release does not change the separately managed R2 download host.
          NOTES
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag "${release_flags[@]}" --title "PhasesAI setup $RELEASE_TAG" --notes-file release-notes.md
